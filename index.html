<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛诸葛CRM · 企业培训咨询服务管理系统</title>
<style>
:root {
  --bg: #FAF9F6;
  --card: #FFFFFF;
  --text-primary: #1A2332;
  --text-secondary: #5A6577;
  --text-muted: #9AA5B4;
  --brand: #2D9B6E;
  --brand-light: #E8F5EE;
  --brand-dark: #1E7A55;
  --accent: #F5A623;
  --accent-light: #FFF3E0;
  --accent-dark: #D4891A;
  --success: #2D9B6E;
  --success-light: #E8F5EE;
  --warning: #F5A623;
  --warning-light: #FFF3E0;
  --danger: #E05252;
  --danger-light: #FDE8E8;
  --purple: #7C5CFC;
  --purple-light: #F0EDFF;
  --border: #E8E6E1;
  --border-light: #F0EEEA;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --sidebar-width: 64px;
  --topnav-height: 44px;
  --header-height: 54px;
  --transition: 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
}

/* ===== TOP HEADER ===== */
.header {
  height: var(--header-height);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  width: var(--sidebar-width);
  flex-shrink: 0;
}

.header-logo svg { width: 28px; height: 28px; }

.header-logo span {
  font-size: 15px;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: -0.3px;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-right .env-tag {
  background: var(--success-light);
  color: var(--success);
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: 500;
}

.header-right .user-info {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: background var(--transition);
}

.header-right .user-info:hover { background: var(--bg); }

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), var(--accent));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 600;
}

.user-name { font-size: 13px; color: var(--text-primary); }
.user-role { font-size: 11px; color: var(--text-muted); }

/* ===== LAYOUT ===== */
.layout {
  display: flex;
  margin-top: var(--header-height);
  height: calc(100vh - var(--header-height));
}

/* ===== LEFT ICON SIDEBAR (1st level) ===== */
.sidebar {
  width: var(--sidebar-width);
  background: #2C3E36;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0;
  flex-shrink: 0;
  overflow-y: auto;
  gap: 2px;
}

.sidebar::-webkit-scrollbar { width: 0; }

.nav-item {
  width: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  cursor: pointer;
  color: rgba(255,255,255,0.55);
  font-size: 10px;
  transition: all var(--transition);
  border-radius: var(--radius-sm);
  position: relative;
  text-align: center;
}

.nav-item:hover {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.85);
}

.nav-item.active {
  background: rgba(45,155,110,0.35);
  color: #fff;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 24px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }

.nav-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 52px;
  font-size: 10px;
  line-height: 1.2;
}

.nav-badge {
  position: absolute;
  top: 4px; right: 4px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  min-width: 16px; height: 16px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
}

/* ===== RIGHT AREA ===== */
.right-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

/* ===== TOP SUB NAV (2nd level) ===== */
.top-nav {
  height: var(--topnav-height);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 0;
  flex-shrink: 0;
  overflow-x: auto;
}

.top-nav-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  margin-right: 24px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.top-nav-title::before {
  content: '';
  width: 3px; height: 14px;
  background: var(--brand);
  border-radius: 2px;
}

.sub-nav-item {
  padding: 10px 16px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13px;
  transition: all var(--transition);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  height: var(--topnav-height);
  display: flex;
  align-items: center;
}

.sub-nav-item:hover {
  color: var(--text-primary);
  background: var(--bg);
}

.sub-nav-item.active {
  color: var(--brand);
  font-weight: 600;
  border-bottom-color: var(--brand);
}

/* ===== MAIN CONTENT ===== */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  min-width: 0;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.page-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}

.page-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ===== TOOLBAR ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 12px;
  height: 36px;
  min-width: 240px;
  transition: border-color var(--transition);
}

.search-box:focus-within { border-color: var(--brand); }
.search-box svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }

.search-box input {
  border: none; outline: none;
  font-size: 13px; flex: 1;
  background: transparent;
  color: var(--text-primary);
}

.filter-select {
  height: 36px;
  padding: 0 32px 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card);
  font-size: 13px;
  color: var(--text-primary);
  cursor: pointer;
  transition: border-color var(--transition);
}

.filter-select:focus { border-color: var(--brand); outline: none; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition);
  white-space: nowrap;
}

.btn svg { width: 16px; height: 16px; }

.btn-primary {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}

.btn-primary:hover { background: var(--brand-dark); }

.btn-accent {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.btn-accent:hover { background: var(--accent-dark); }

.btn-outline {
  background: var(--card);
  color: var(--text-primary);
  border-color: var(--border);
}

.btn-outline:hover { border-color: var(--brand); color: var(--brand); }

.btn-sm { height: 30px; padding: 0 12px; font-size: 12px; }

.btn-text {
  background: transparent;
  color: var(--brand);
  border: none;
  padding: 0 8px;
  height: auto;
}

.btn-text:hover { color: var(--brand-dark); }

.toolbar-right { margin-left: auto; display: flex; gap: 8px; }

/* ===== TABLE ===== */
.table-container {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

table { width: 100%; border-collapse: collapse; }
thead { background: var(--bg); }

th {
  padding: 10px 16px;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light);
  font-size: 13px;
  color: var(--text-primary);
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: #FDFCFA; }

.clickable-cell {
  color: var(--brand);
  cursor: pointer;
  font-weight: 500;
}

.clickable-cell:hover { text-decoration: underline; }

/* ===== STATUS BADGES ===== */
.status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
}

.status::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
}

.status-new { background: var(--brand-light); color: var(--brand); }
.status-new::before { background: var(--brand); }
.status-following { background: var(--warning-light); color: var(--warning); }
.status-following::before { background: var(--warning); }
.status-signed { background: var(--success-light); color: var(--success); }
.status-signed::before { background: var(--success); }
.status-serving { background: var(--purple-light); color: var(--purple); }
.status-serving::before { background: var(--purple); }
.status-done { background: #F0EEEA; color: var(--text-muted); }
.status-done::before { background: var(--text-muted); }
.status-lost { background: var(--danger-light); color: var(--danger); }
.status-lost::before { background: var(--danger); }

/* ===== PAGINATION ===== */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--card);
}

.pagination-info { font-size: 13px; color: var(--text-muted); }

.pagination-btns { display: flex; gap: 4px; }

.pg-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition);
}

.pg-btn:hover { border-color: var(--brand); color: var(--brand); }
.pg-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 60px;
  overflow-y: auto;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 680px;
  max-width: 95vw;
  margin-bottom: 40px;
  animation: modalIn 0.25s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}

.modal-title { font-size: 17px; font-weight: 700; }

.modal-close {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  cursor: pointer;
  transition: background var(--transition);
  border: none; background: transparent;
  font-size: 18px; color: var(--text-muted);
}

.modal-close:hover { background: var(--bg); }

.modal-body { padding: 24px; }

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}

/* ===== FORM ===== */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }

.form-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}

.form-label .required { color: var(--danger); margin-left: 2px; }

.form-input, .form-textarea, .form-select {
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--card);
  transition: border-color var(--transition);
}

.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 3px rgba(45,155,110,0.1);
}

.form-textarea {
  height: auto;
  min-height: 80px;
  padding: 10px 12px;
  resize: vertical;
  font-family: inherit;
}

.form-select { appearance: none; cursor: pointer; }

/* ===== DASHBOARD CARDS ===== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border-left: 3px solid var(--brand);
}

.stat-card.warn-card { border-left-color: var(--accent); }
.stat-card.danger-card { border-left-color: var(--danger); }
.stat-card.purple-card { border-left-color: var(--purple); }

.stat-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
}

.stat-change {
  font-size: 12px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.stat-up { color: var(--success); }
.stat-down { color: var(--danger); }

/* ===== DETAIL PANEL ===== */
.detail-panel {
  position: fixed;
  top: var(--header-height);
  right: -540px;
  width: 540px;
  height: calc(100vh - var(--header-height));
  background: var(--card);
  box-shadow: var(--shadow-lg);
  z-index: 200;
  transition: right 0.3s ease;
  overflow-y: auto;
  border-left: 1px solid var(--border);
}

.detail-panel.open { right: 0; }

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 10;
}

.detail-title { font-size: 17px; font-weight: 700; }
.detail-body { padding: 24px; }

.detail-section { margin-bottom: 24px; }

.detail-section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.detail-section-title::before {
  content: '';
  width: 3px; height: 14px;
  background: var(--brand);
  border-radius: 2px;
}

.detail-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 8px;
  padding: 6px 0;
  font-size: 13px;
}

.detail-label { color: var(--text-muted); }
.detail-value { color: var(--text-primary); }

/* ===== TIMELINE ===== */
.timeline {
  position: relative;
  padding-left: 24px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 7px; top: 4px; bottom: 4px;
  width: 2px;
  background: var(--border);
}

.timeline-item {
  position: relative;
  padding-bottom: 20px;
}

.timeline-item:last-child { padding-bottom: 0; }

.timeline-dot {
  position: absolute;
  left: -20px; top: 4px;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid var(--brand);
  background: var(--card);
}

.timeline-item.completed .timeline-dot { background: var(--brand); }

.timeline-time { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
.timeline-content { font-size: 13px; color: var(--text-primary); }
.timeline-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ===== TABS ===== */
.tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.tab-item {
  padding: 10px 20px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
}

.tab-item:hover { color: var(--text-primary); }

.tab-item.active {
  color: var(--brand);
  font-weight: 600;
  border-bottom-color: var(--brand);
}

/* ===== PROJECT FLOW ===== */
.flow-steps {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.flow-step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;
  background: var(--bg);
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition);
}

.flow-step.active { background: var(--brand-light); color: var(--brand); font-weight: 600; }
.flow-step.done { background: var(--success-light); color: var(--success); }

.flow-step .step-num {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  background: var(--border);
  color: var(--text-muted);
}

.flow-step.active .step-num { background: var(--brand); color: #fff; }
.flow-step.done .step-num { background: var(--success); color: #fff; }

/* ===== SECTIONS ===== */
.section-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 20px;
  margin-bottom: 16px;
}

.section-card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text-primary);
}

/* ===== TASK LIST ===== */
.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-light);
}

.task-item:last-child { border-bottom: none; }

.task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.task-dot.urgent { background: var(--danger); }
.task-dot.normal { background: var(--accent); }
.task-dot.low { background: var(--brand); }

.task-text { flex: 1; font-size: 13px; }
.task-meta { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

/* ===== QUICK ACTIONS ===== */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 12px;
}

.quick-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
}

.quick-item:hover { background: var(--bg); }

.quick-icon {
  width: 40px; height: 40px;
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
}

.quick-icon svg { width: 20px; height: 20px; }
.quick-label { font-size: 12px; color: var(--text-secondary); }

/* ===== FOLLOW-UP METHOD TAGS ===== */
.method-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}

.method-phone { background: #E8F5EE; color: #2D9B6E; }
.method-wechat { background: #E8F8EE; color: #07C160; }
.method-visit { background: #FFF3E0; color: #D4891A; }
.method-online { background: #E8EEFF; color: #4A6CF7; }

/* ===== WORK PLAN COLOR REMINDERS ===== */
.plan-urgent { border-left: 3px solid var(--danger); padding-left: 12px; }
.plan-normal { border-left: 3px solid var(--accent); padding-left: 12px; }
.plan-low { border-left: 3px solid var(--brand); padding-left: 12px; }
.plan-overdue { background: #FFF5F5; }
.plan-carry { background: #FFF9EE; }

/* ===== CATEGORY TAGS ===== */
.cat-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  gap: 4px;
}
.cat-edu { background: #E8F5EE; color: #2D9B6E; }
.cat-consult { background: #FFF3E0; color: #D4891A; }
.cat-invest { background: #F0EDFF; color: #7C5CFC; }
.cat-digital { background: #E8EEFF; color: #4A6CF7; }
.cat-sme { background: #FDE8E8; color: #E05252; }

/* ===== PROGRESS BAR ===== */
.progress-bar {
  display: flex; align-items: center; gap: 8px;
}
.progress-track {
  flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; min-width: 60px;
}
.progress-fill {
  height: 100%; border-radius: 4px; transition: width 0.3s;
}
.progress-text { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .top-nav { display: none; }
  .main-content { padding: 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .detail-panel { width: 100%; right: -100%; }
  .modal { width: 95vw; }
}

/* ===== FOCUS VISIBLE ===== */
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

@media print {
  .sidebar, .top-nav, .header, .toolbar, .pagination { display: none; }
  .main-content { padding: 0; }
  .detail-panel { position: static; width: 100%; box-shadow: none; }
  .table-container { box-shadow: none; }
}
</style>

let currentNav = 'dashboard';
let currentSub = 'dash-overview';

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = navItems.map(n => '<div class="nav-item '+(n.id===currentNav?'active':'')+'" onclick="switchNav(\''+n.id+'\')" title="'+n.label+'">'+n.icon+'<span class="nav-label">'+n.label+'</span>'+(n.badge?'<span class="nav-badge">'+n.badge+'</span>':'')+'</div>').join('');
}

function renderTopNav() {
  const tn = document.getElementById('topNav');
  const items = subNavs[currentNav] || [];
  const navLabel = navItems.find(n=>n.id===currentNav)?.label || '';
  tn.innerHTML = '<div class="top-nav-title">'+navLabel+'</div>'+items.map(s => '<div class="sub-nav-item '+(s.id===currentSub?'active':'')+'" onclick="switchSub(\''+s.id+'\')">'+s.label+'</div>').join('');
}

function switchNav(id) {
  currentNav = id;
  currentSub = subNavs[id][0].id;
  renderSidebar();
  renderTopNav();
  renderContent();
}

function switchSub(id) {
  currentSub = id;
  renderTopNav();
  renderContent();
}

function renderContent() {
  const mc = document.getElementById('mainContent');
  closeDetail();

function renderCustomerRows(data) {
  var tbody = document.getElementById('customerTableBody');
  if (!tbody) return;
  tbody.innerHTML = data.map(function(c) {
    var transferHtml = c.transferStatus !== '-' ? '<span style="font-size:11px;padding:2px 8px;border-radius:8px;background:'+(c.transferStatus.indexOf('已完成')>=0?'var(--success-light)':'var(--warning-light)')+';color:'+(c.transferStatus.indexOf('已完成')>=0?'var(--success)':'var(--accent)')+'">'+c.transferStatus+'</span>' : '<span style="color:var(--text-muted)">-</span>';
    return '<tr><td style="color:var(--text-muted)">'+c.id+'</td><td class="clickable-cell" onclick="openCustomerDetail(\''+c.id+'\')">'+c.name+'</td><td>'+c.contact+'</td><td><span class="cat-tag '+getCatClass(c.bizType)+'">'+c.bizType+'</span></td><td>'+c.source+'</td><td><span style="font-weight:600;color:'+(c.level==='A'?'var(--danger)':c.level==='B'?'var(--accent)':'var(--text-muted)')+'">'+c.level+'</span></td><td><span class="status '+statusMap[c.status].cls+'">'+statusMap[c.status].text+'</span></td><td>'+transferHtml+'</td><td>'+c.owner+'</td><td><button class="btn btn-text btn-sm" onclick="openCustomerDetail(\''+c.id+'\')">详情</button><button class="btn btn-text btn-sm" onclick="alert(\'编辑 '+c.name+'\')">编辑</button></td></tr>';
  }).join('');
  document.getElementById('custTotal').textContent = data.length;
}

function filterCustomers() {
  var search = (document.getElementById('custSearch')?.value || '').toLowerCase();
  var status = document.getElementById('filterStatus')?.value || '';
  var level = document.getElementById('filterLevel')?.value || '';
  var source = document.getElementById('filterSource')?.value || '';
  var filtered = customers.filter(function(c) {
    if (search && c.name.toLowerCase().indexOf(search)===-1 && c.contact.indexOf(search)===-1 && c.phone.indexOf(search)===-1) return false;
    if (status && c.status !== status) return false;
    if (level && c.level !== level) return false;
    if (source && c.source !== source) return false;
    return true;
  });
  renderCustomerRows(filtered);
}

  var c = coursewares.find(function(x){return x.id===id});
  if (!c) return;
  document.getElementById('detailTitle').textContent = c.name;
  document.getElementById('detailBody').innerHTML = '<div class="detail-section"><div class="detail-section-title">课件信息</div>'
    + '<div class="detail-row"><span class="detail-label">编号</span><span class="detail-value">'+c.id+'</span></div>'
    + '<div class="detail-row"><span class="detail-label">类型</span><span class="detail-value">'+c.type+'</span></div>'
    + '<div class="detail-row"><span class="detail-label">关联课程</span><span class="detail-value">'+c.course+'</span></div>'
    + '<div class="detail-row"><span class="detail-label">上传人</span><span class="detail-value">'+c.uploader+'</span></div>'
    + '<div class="detail-row"><span class="detail-label">上传时间</span><span class="detail-value">'+c.uploadTime+'</span></div>'
    + '<div class="detail-row"><span class="detail-label">下载次数</span><span class="detail-value" style="font-weight:600;color:var(--brand)">'+c.downloads+' 次</span></div>'
    + '<div class="detail-row"><span class="detail-label">学员可见</span><span class="detail-value">'+(c.visible?'是':'否')+'</span></div></div>'
    + '<div class="detail-section"><div class="detail-section-title">学员学习进度</div>'
    + '<div class="detail-row"><span class="detail-label">整体进度</span><span class="detail-value"><div class="progress-bar" style="max-width:200px"><div class="progress-track"><div class="progress-fill" style="width:'+(c.progress.indexOf('%')>=0?c.progress.replace('%',''):'0')+'%;background:var(--brand)"></div></div><span class="progress-text">'+c.progress+'</span></div></span></div>'

    + '<div class="detail-row"><span class="detail-label">学习中</span><span class="detail-value">28 人</span></div>'
    + '<div class="detail-row"><span class="detail-label">未开始</span><span class="detail-value">5 人</span></div></div>'

function submitCustomer() {
  var name = document.getElementById('f_name').value;
  var contact = document.getElementById('f_contact').value;
  if (!name || !contact) { alert('请填写必填字段'); return; }
  var newId = 'C' + String(customers.length + 1).padStart(3, '0');
  customers.push({
    id:newId, name:name, contact:contact,
    phone:document.getElementById('f_phone').value||'-',
    industry:document.getElementById('f_industry').value||'-',
    source:document.getElementById('f_source').value||'-',
    level:document.getElementById('f_level').value||'C',
    status:'new',
    owner:document.getElementById('f_owner').value||'-',
    bizType:document.getElementById('f_bizType').value||'-',
    transferStatus:'-', transferAmount:0,
    createTime:'2026-09-03', nextFollow:'-', followRecords:[]
  });
  closeModal('addCustomerModal');
  alert('客户 ' + name + ' 已成功新增！');
  if (currentSub === 'cust-list') renderCustomerList(document.getElementById('mainContent'));
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.remove('show');
  });
});

// ===== INIT =====
renderSidebar();
renderTopNav();
renderContent();
</script>
