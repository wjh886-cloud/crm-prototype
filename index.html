<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <title>声浪工坊 · 商户广告文字转语音</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="prototype-shell">
    <div class="status-bar" aria-label="系统状态栏">
      <span>09:41</span>
      <div class="status-icons"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></div>
    </div>
    <header class="topbar">
      <div class="brand-lockup"><span class="brand-icon"><i data-lucide="waves" aria-hidden="true"></i></span><span>声浪工坊</span></div>
      <button class="icon-button" data-action="open-help" aria-label="帮助"><i data-lucide="circle-help"></i></button>
    </header>
    <main id="app" class="app-content" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-button active" data-tab="workbench"><i data-lucide="mic-2" aria-hidden="true"></i><span>工作台</span></button>
      <button class="nav-button" data-tab="history"><i data-lucide="history" aria-hidden="true"></i><span>历史</span></button>
      <button class="nav-button" data-tab="membership"><i data-lucide="crown" aria-hidden="true"></i><span>会员</span></button>
      <button class="nav-button" data-tab="profile"><i data-lucide="user-round" aria-hidden="true"></i><span>我的</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="../vendor/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
